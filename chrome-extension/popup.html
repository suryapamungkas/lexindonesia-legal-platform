<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>LexIndonesia Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0B192C;
      color: #FFFFFF;
      padding: 1rem;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }
    .logo-box {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #FFB800 0%, #FF9900 100%);
      color: #0B192C;
      font-weight: 900;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .title { font-size: 0.9375rem; font-weight: 800; }
    .search-box {
      margin-bottom: 1rem;
    }
    .input {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      font-size: 0.8125rem;
      outline: none;
    }
    .input:focus {
      border-color: #FFB800;
      background-color: rgba(255, 255, 255, 0.14);
    }
    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.55rem;
      border-radius: 6px;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }
    .btn-gold {
      background: linear-gradient(135deg, #FFB800 0%, #FF9900 100%);
      color: #0B192C;
    }
    .btn-gold:hover {
      background: #FFC107;
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .status-badge {
      font-size: 0.6875rem;
      color: #94A3B8;
      text-align: center;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-box">⚖️</div>
    <div class="title">LexIndonesia Assistant</div>
  </div>

  <div class="search-box">
    <input type="text" id="popup-search-input" class="input" placeholder="Cari pasal, UU, putusan...">
  </div>

  <div class="actions-grid">
    <button type="button" id="btn-open-sidepanel" class="btn btn-gold">
      ⚡ Buka Side Panel Riset
    </button>
    <button type="button" id="btn-open-web-platform" class="btn btn-outline">
      🌐 Buka Web Platform
    </button>
  </div>

  <div class="status-badge">
    Workspace Tersinkronisasi • MV3 Ready
  </div>

  <script src="popup.js"></script>
</body>
</html>
